name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  policy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned, same as checkov (see the checkov job below): an unpinned
      # tool version can't silently change what CI enforces.
      - name: Install conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.69.0/conftest_0.69.0_Linux_x86_64.tar.gz -o conftest.tar.gz
          tar xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/

      - name: Test policy fixtures (aws)
        run: ./scripts/test-policy-fixtures.sh aws

      - name: Test policy fixtures (gcp)
        run: ./scripts/test-policy-fixtures.sh gcp

  terraform-validate:
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # 15+ modules each run their own `terraform init`; without a shared
      # cache every one of them re-downloads the AWS provider from scratch.
      - uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      # Catches drift in the shared required_version/required_providers
      # block described in context/project-overview.md — see
      # scripts/check-module-versions.sh.
      - name: check module versions.tf drift
        run: ./scripts/check-module-versions.sh

      - name: terraform validate (every module and example)
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for dir in modules/*/*/ examples/*/*/; do
            if compgen -G "${dir}*.tf" > /dev/null; then
              echo "== ${dir} =="
              (cd "$dir" && terraform init -backend=false -input=false >/dev/null && terraform validate)
            fi
          done

  terraform-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # Reference implementation for `terraform test` coverage of module
      # logic (validation rules, conditional resources) — see
      # context/project-overview.md, "Module `terraform test` coverage".
      # `mock_provider` in tests/budget.tftest.hcl means no AWS credentials
      # are needed here. Only `budget` has tests so far; this loops over
      # modules/aws/*/tests/ so backfilling the rest just means adding the
      # directory, no CI change.
      - name: terraform test (every module with tests/)
        run: |
          set -euo pipefail
          for dir in modules/aws/*/; do
            if [[ -d "${dir}tests" ]]; then
              echo "== ${dir} =="
              (cd "$dir" && terraform init -backend=false -input=false >/dev/null && terraform test)
            fi
          done

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pinned via requirements.txt (dependabot's pip ecosystem tracks it —
      # see .github/dependabot.yml) rather than `pip install checkov`
      # unpinned, so a checkov release can't silently change what CI enforces.
      - name: Install checkov
        run: pip install -r requirements.txt

      # Uses .checkov.yaml at the repo root — every skipped check there has
      # a documented reason. This is a real gate, not report-only: a new
      # finding either gets fixed or gets a new, justified skip entry.
      - name: checkov scan
        run: checkov -d modules/aws --compact --quiet
