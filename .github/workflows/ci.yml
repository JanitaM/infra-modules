name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  policy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs whatever conftest currently tags "latest", matching this
      # repo's own decision that policy tooling isn't pinned (see
      # context/project-overview.md, "Policy versioning").
      - name: Install conftest
        run: |
          url=$(curl -sL https://api.github.com/repos/open-policy-agent/conftest/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*Linux_x86_64.tar.gz"' \
            | cut -d '"' -f4)
          curl -sL "$url" -o conftest.tar.gz
          tar xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/

      - name: Test policy fixtures (aws)
        run: ./scripts/test-policy-fixtures.sh aws

      - name: Test policy fixtures (gcp)
        run: ./scripts/test-policy-fixtures.sh gcp

  terraform-validate:
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # 15+ modules each run their own `terraform init`; without a shared
      # cache every one of them re-downloads the AWS provider from scratch.
      - uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform validate (every module and example)
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for dir in modules/*/*/ examples/*/*/; do
            if compgen -G "${dir}*.tf" > /dev/null; then
              echo "== ${dir} =="
              (cd "$dir" && terraform init -backend=false -input=false >/dev/null && terraform validate)
            fi
          done

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pinned via requirements.txt (dependabot's pip ecosystem tracks it —
      # see .github/dependabot.yml) rather than `pip install checkov`
      # unpinned, so a checkov release can't silently change what CI enforces.
      - name: Install checkov
        run: pip install -r requirements.txt

      # Uses .checkov.yaml at the repo root — every skipped check there has
      # a documented reason. This is a real gate, not report-only: a new
      # finding either gets fixed or gets a new, justified skip entry.
      - name: checkov scan
        run: checkov -d modules/aws --compact --quiet
